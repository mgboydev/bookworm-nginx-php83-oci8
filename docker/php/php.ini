; General
cgi.fix_pathinfo=0
date.timezone=Asia/Jakarta
variables_order=EGPCS
expose_php=Off

; Resource limits
memory_limit=256M
max_execution_time=300
max_input_time=300
max_input_vars=5000

; Upload
file_uploads=On
upload_max_filesize=100M
post_max_size=100M
max_file_uploads=20

; Error handling
log_errors=On
display_errors=Off
display_startup_errors=Off
error_reporting=E_ALL

; Sessions
session.use_strict_mode=1
session.cookie_httponly=1
